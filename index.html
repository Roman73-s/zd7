<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARTEX — Галерея (ЛР7)</title>
  
  <!-- Подключение стилей Slick Slider -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>
  
  <!-- Твой стиль -->
  <link rel="stylesheet" href="style.css">
  
  <!-- jQuery и Slick JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
  
  <!-- Твой скрипт инициализации -->
  <script src="script.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">

  <header class="site-header">
    <div class="container">
      <div class="row align-items-center py-3">
        <div class="col-12 text-center text-md-left">
          <a href="#" class="logo-link d-inline-block align-middle mr-2">
            <img src="logo.png" alt="Логотип" class="logo">
          </a>
          <h1 class="m-0 d-inline-block align-middle">ARTEX</h1>
        </div>
      </div>
    </div>
  </header>

  <main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-12">
        <h2 class="text-center mb-4">Галерея нейро-имплантов</h2>
        
        <!-- Контейнер для слайдера -->
        <div class="slider-wrapper">
          <div class="artex-slider">
            <div><img src="https://picsum.photos/400/300?random=1" alt="Имплант 1"></div>
            <div><img src="https://picsum.photos/400/300?random=2" alt="Имплант 2"></div>
            <div><img src="https://picsum.photos/400/300?random=3" alt="Имплант 3"></div>
            <div><img src="https://picsum.photos/400/300?random=4" alt="Имплант 4"></div>
            <div><img src="https://picsum.photos/400/300?random=5" alt="Имплант 5"></div>
            <div><img src="https://picsum.photos/400/300?random=6" alt="Имплант 6"></div>
            <div><img src="https://picsum.photos/400/300?random=7" alt="Имплант 7"></div>
            <div><img src="https://picsum.photos/400/300?random=8" alt="Имплант 8"></div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container py-3 text-center">
      (c) ARTEX, 2026
    </div>
  </footer>

</body>
</html>
